<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVO - 最新技术亮点</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 520px; margin: 20px auto; padding: 0 16px; }
    .banner { background: #f0f4ff; border: 1px solid #c0d0f0; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    .banner h2 { margin: 0 0 8px 0; font-size: 1rem; }
    .banner p { margin: 0; font-size: 0.85rem; color: #555; }
    .banner a { color: #0066cc; }
    .item { margin-bottom: 12px; padding: 10px 12px; background: #fafafa; border-radius: 6px; }
    .item h3 { margin: 0 0 6px 0; font-size: 0.95rem; }
    .item p { margin: 0; font-size: 0.85rem; color: #444; }
    .item a { color: #0066cc; font-size: 0.85rem; }
    .foot { font-size: 0.75rem; color: #888; margin-top: 16px; }
    .close-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .close-btn { padding: 6px 12px; background: #e0e0e0; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .close-btn:hover { background: #d0d0d0; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="close-row">
      <h2 style="margin:0;">最新 AI 技术亮点</h2>
      <button class="close-btn" id="closeBtn">关闭此区域</button>
    </div>
    <p class="foot">此区域用于分享最新技术进展，由社区维护。</p>
    <div id="list"></div>
    <p class="foot"><a href="http://localhost:3000" target="_blank" rel="noopener">打开 OVO 聊天 →</a></p>
  </div>
  <script>
    var HIDE_KEY = 'recallweb_highlights_hide';
    var data = [
      { title: "Qwen3.5 新多模态能力", desc: "通义千问多模态理解与生成能力升级，支持更复杂的图文与文档理解。", url: "https://dashscope.aliyun.com/" },
      { title: "DeepSeek V3 推理速度提升", desc: "DeepSeek 推理侧优化，响应延迟降低，适合高并发与长对话。", url: "https://www.deepseek.com/" },
      { title: "Grok Imagine 视频升级", desc: "xAI Grok 视频生成与理解能力更新，与对话深度整合。", url: "https://x.ai/" },
      { title: "Claude 3.5 长上下文与代码", desc: "Anthropic Claude 长上下文与代码能力增强，适合代码与文档分析。", url: "https://www.anthropic.com/" },
      { title: "智谱 GLM-4 与 Kimi 长文本", desc: "国产模型长文本与多轮对话体验持续优化，中文场景性价比高。", url: "https://open.bigmodel.cn/" }
    ];
    function render() {
      var list = document.getElementById('list');
      list.innerHTML = data.map(function (d) {
        return '<div class="item"><h3>' + d.title + '</h3><p>' + d.desc + '</p><a href="' + d.url + '" target="_blank" rel="noopener">官网</a></div>';
      }).join('');
    }
    function hide() {
      localStorage.setItem(HIDE_KEY, '1');
      document.getElementById('panel').innerHTML = '<p class="foot"><a href="http://localhost:3000" target="_blank" rel="noopener">打开 OVO →</a> <button class="close-btn" id="showBtn">显示技术亮点</button></p>';
      document.getElementById('showBtn').onclick = function () { localStorage.removeItem(HIDE_KEY); location.reload(); };
    }
    if (localStorage.getItem(HIDE_KEY) === '1') {
      document.getElementById('panel').innerHTML = '<p class="foot"><a href="http://localhost:3000" target="_blank" rel="noopener">打开 OVO →</a> <button class="close-btn" id="showBtn">显示技术亮点</button></p>';
      document.getElementById('showBtn').onclick = function () { localStorage.removeItem(HIDE_KEY); location.reload(); };
    } else {
      render();
      document.getElementById('closeBtn').onclick = hide;
    }
  </script>
</body>
</html>
