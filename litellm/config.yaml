# LiteLLM 统一网关配置 - OVO
# 将下方 your-xxx-api-key 替换为真实 API Key 后即可使用对应模型
# 本地 Ollama 模型无需 Key，安装 Ollama 并拉取模型即可用，见 docs/06-Ollama-本地免Key.md

model_list:
  # ========== 本地模型 Ollama（无需 API Key）==========
  - model_name: ollama-qwen2
    litellm_params:
      model: ollama/qwen2:7b
      api_base: "http://host.docker.internal:11434"
    model_info:
      description: "Ollama 本地 - 通义 Qwen2 7B，中文友好，免 Key"

  - model_name: ollama-llama3
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: "http://host.docker.internal:11434"
    model_info:
      description: "Ollama 本地 - Llama 3.2 3B，免 Key"

  - model_name: ollama-phi3
    litellm_params:
      model: ollama/phi3:mini
      api_base: "http://host.docker.internal:11434"
    model_info:
      description: "Ollama 本地 - Phi-3 小模型，免 Key"

  # ========== 国际模型 ==========
  - model_name: grok-3-mini
    litellm_params:
      model: xai/grok-3-mini
      api_key: "your-xai-api-key"
    model_info:
      description: "xAI Grok 3 Mini"

  - model_name: grok-4
    litellm_params:
      model: xai/grok-4
      api_key: "your-xai-api-key"
    model_info:
      description: "xAI Grok 4"

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: "your-anthropic-api-key"
    model_info:
      description: "Claude 3.5 Sonnet"

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: "your-anthropic-api-key"
    model_info:
      description: "Claude 3.5 Haiku"

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: "your-openai-api-key"
    model_info:
      description: "OpenAI GPT-4o"

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "your-openai-api-key"
    model_info:
      description: "OpenAI GPT-4o Mini"

  # ========== 中国模型（中文理解 & 性价比极高）==========
  - model_name: qwen-turbo
    litellm_params:
      model: dashscope/qwen-turbo
      api_key: "your-dashscope-api-key"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_info:
      description: "通义千问 Turbo"

  - model_name: qwen-plus
    litellm_params:
      model: dashscope/qwen-plus
      api_key: "your-dashscope-api-key"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_info:
      description: "通义千问 Plus"

  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: "your-deepseek-api-key"
    model_info:
      description: "DeepSeek Chat"

  - model_name: deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: "your-deepseek-api-key"
    model_info:
      description: "DeepSeek Reasoner"

  - model_name: glm-4-flash
    litellm_params:
      model: zai/glm-4.5-flash
      api_key: "your-zhipu-api-key"
    model_info:
      description: "智谱 GLM-4 Flash"

  - model_name: glm-4
    litellm_params:
      model: zai/glm-4.5
      api_key: "your-zhipu-api-key"
    model_info:
      description: "智谱 GLM-4"

  - model_name: kimi-moonshot-8k
    litellm_params:
      model: moonshot/moonshot-v1-8k
      api_key: "your-moonshot-api-key"
    model_info:
      description: "Kimi Moonshot 8K"

  - model_name: kimi-moonshot-32k
    litellm_params:
      model: moonshot/moonshot-v1-32k
      api_key: "your-moonshot-api-key"
    model_info:
      description: "Kimi Moonshot 32K"

general_settings:
  master_key: "sk-1234"