<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; padding: 12px; font-family: system-ui, sans-serif; font-size: 14px; margin: 0; }
    h3 { margin: 0 0 10px 0; font-size: 14px; }
    p { color: #666; margin: 0 0 12px 0; font-size: 12px; }
    button { width: 100%; padding: 10px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #c73e54; }
    #status { margin-top: 10px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h3>推送到OVO</h3>
  <p>将当前页面标题、URL 与正文发送到本机OVO（127.0.0.1:8888），可在OVO中「读取最新」或「插入到当前输入」。</p>
  <button id="sendBtn">推送当前页面</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
